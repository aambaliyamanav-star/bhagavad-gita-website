<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Blue Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1557b0" />
      <stop offset="50%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>

    <!-- Golden Aura Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Divine Radiance Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Sacred Outer Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2.5" />

  <!-- Radiance Rays / Sacred Chakra Aura -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="2">
    <line x1="256" y1="44" x2="256" y2="70" />
    <line x1="256" y1="442" x2="256" y2="468" />
    <line x1="44" y1="256" x2="70" y2="256" />
    <line x1="442" y1="256" x2="468" y2="256" />
    <line x1="106" y1="106" x2="126" y2="126" />
    <line x1="386" y1="386" x2="406" y2="406" />
    <line x1="406" y1="106" x2="386" y2="126" />
    <line x1="106" y1="406" x2="126" y2="386" />
  </g>

  <!-- Center Sacred Lotus / Divine Motif -->
  <g transform="translate(256, 230) scale(1.6)" filter="url(#glow)">
    <!-- Central Lotus Petal -->
    <path d="M 0 -70 C 22 -30, 20 10, 0 35 C -20 10, -22 -30, 0 -70 Z" fill="url(#goldGrad)" />
    
    <!-- Left Inner Petal -->
    <path d="M -6 18 C -35 -15, -45 -50, -32 -60 C -18 -42, 0 5, -6 18 Z" fill="#fbbf24" opacity="0.95" />
    
    <!-- Right Inner Petal -->
    <path d="M 6 18 C 35 -15, 45 -50, 32 -60 C 18 -42, 0 5, 6 18 Z" fill="#fbbf24" opacity="0.95" />

    <!-- Left Outer Petal -->
    <path d="M -10 24 C -55 5, -70 -25, -55 -38 C -40 -20, -5 10, -10 24 Z" fill="#f59e0b" opacity="0.88" />

    <!-- Right Outer Petal -->
    <path d="M 10 24 C 55 5, 70 -25, 55 -38 C 40 -20, 5 10, 10 24 Z" fill="#f59e0b" opacity="0.88" />

    <!-- Lotus Base Pedestal -->
    <path d="M -44 32 C -20 44, 20 44, 44 32 C 30 22, -30 22, -44 32 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="18" r="6" fill="#ffffff" />
  </g>

  <!-- Sacred Script text: "ભગવદ્ ગીતા" -->
  <text x="256" y="420" font-family="'Noto Sans Gujarati', 'Shruti', 'Segoe UI', sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="2">
    ભગવદ્ ગીતા
  </text>
  <text x="256" y="454" font-family="'Noto Sans Gujarati', 'Shruti', 'Segoe UI', sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#93c5fd" letter-spacing="1">
    ॥ શ્રીકૃષ્ણ શરણં મમ ॥
  </text>
</svg>

