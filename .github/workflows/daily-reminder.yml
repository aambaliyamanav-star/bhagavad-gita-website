name: Gita Push Notifications (Every 2 Hours)

on:
  schedule:
    # 06:00 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
    # 08:00 AM IST = 02:30 UTC
    - cron: '30 2 * * *'
    # 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * *'
    # 12:00 PM IST = 06:30 UTC
    - cron: '30 6 * * *'
    # 02:00 PM IST = 08:30 UTC
    - cron: '30 8 * * *'
    # 04:00 PM IST = 10:30 UTC
    - cron: '30 10 * * *'
    # 06:00 PM IST = 12:30 UTC
    - cron: '30 12 * * *'
    # 08:00 PM IST = 14:30 UTC
    - cron: '30 14 * * *'
    # 10:00 PM IST = 16:30 UTC
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gita Push Notification (Every 2 Hours)
        run: |
          echo "Sending 2-Hour Gita Push Notification to all subscribed devices..."
          curl --retry 3 --retry-delay 5 --retry-all-errors --max-time 180 --connect-timeout 60 -sS -X GET "https://bhagavad-gita-backend-jy1a.onrender.com/api/notifications/trigger-2hr-reminder"
          echo ""
          echo "2-Hour notification trigger completed successfully."
