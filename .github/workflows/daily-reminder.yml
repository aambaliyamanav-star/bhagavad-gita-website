name: Daily Gita Push Notifications (Every 3 Hours)

on:
  schedule:
    # 06:00 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
    # 09:00 AM IST = 03:30 UTC
    - cron: '30 3 * * *'
    # 12:00 PM IST = 06:30 UTC
    - cron: '30 6 * * *'
    # 03:00 PM IST = 09:30 UTC
    - cron: '30 9 * * *'
    # 06:00 PM IST = 12:30 (12:30 PM) UTC
    - cron: '30 12 * * *'
    # 09:00 PM IST = 15:30 (03:30 PM) UTC
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Gita Push Notification (Every 3 Hours)
        run: |
          echo "Sending 3-hour Gita Push Notification to App users..."
          curl --retry 5 --retry-delay 10 --retry-all-errors --max-time 180 --connect-timeout 60 -sS -X GET "https://bhagavad-gita-website.onrender.com/api/notifications/trigger-daily-reminder"
          echo ""
          echo "Notification trigger completed."
